<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#8e2a22"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#c4574a" stroke-width="3"/>
      <line x1="0" y1="7" x2="14" y2="7" stroke="#6e1d17" stroke-width="1.5"/>
    </pattern>
    <filter id="fade" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.9  0 0 0 0 0.82  0 0 0 0.35 -0.05" result="specks"/>
      <feComposite in="specks" in2="SourceGraphic" operator="in" result="sp"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sp"/></feMerge>
    </filter>
  </defs>
  <rect width="500" height="700" fill="#efe6d2"/>
  <g filter="url(#fade)">
    <rect x="26" y="26" width="448" height="648" rx="18" fill="url(#hatch)"/>
    <rect x="40" y="40" width="420" height="620" rx="12" fill="none" stroke="#efe6d2" stroke-width="5"/>
    <rect x="52" y="52" width="396" height="596" rx="8" fill="none" stroke="#efe6d2" stroke-width="2"/>
    <g transform="translate(250 350)" fill="#efe6d2" stroke="#6e1d17" stroke-width="2">
      <ellipse rx="92" ry="128" fill="#8e2a22" stroke="#efe6d2" stroke-width="6"/>
      <ellipse rx="74" ry="108" fill="none" stroke="#efe6d2" stroke-width="2"/>
      <path d="M0 -70 C 22 -40, 46 -20, 46 6 C 46 30, 22 40, 8 28 L 16 66 L -16 66 L -8 28 C -22 40, -46 30, -46 6 C -46 -20, -22 -40, 0 -70 Z"/>
    </g>
    <g fill="#efe6d2">
      <circle cx="90" cy="90" r="12"/><circle cx="410" cy="90" r="12"/>
      <circle cx="90" cy="610" r="12"/><circle cx="410" cy="610" r="12"/>
    </g>
  </g>
</svg>
