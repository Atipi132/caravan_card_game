# Production stack on the VPS (lives in /opt/caravan, copied there by the GitHub Actions workflow).
#   caravan : the game (Node server + built client), only reachable through Caddy
#   caddy   : reverse proxy with automatic HTTPS (Let's Encrypt) and WebSocket support
#
# Configuration comes from /opt/caravan/.env (written by deploy.sh):
#   DOMAIN=caravan-yourname.duckdns.org
#   CARAVAN_IMAGE=ghcr.io/<owner>/<repo>:<sha>

services:
  caravan:
    image: ${CARAVAN_IMAGE:?set CARAVAN_IMAGE in .env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
    expose:
      - '3000'
    stop_grace_period: 10s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - caravan
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

volumes:
  caddy_data: {}
  caddy_config: {}
