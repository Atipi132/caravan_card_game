#cloud-config
# Paste this into the "Cloud config / User data" field when creating the VPS (Hetzner, OVH, Scaleway...).
# Ubuntu 24.04. Replace the two SSH public keys below before using it.
#
# Result: a `deploy` user (SSH key only, sudo, docker), root & password logins disabled,
# firewall allowing only SSH/HTTP/HTTPS, automatic security updates, Docker installed,
# and /opt/caravan ready for the GitHub Actions deployment.

users:
  - name: deploy
    groups: [sudo]
    shell: /bin/bash
    sudo: 'ALL=(ALL) NOPASSWD:ALL'
    lock_passwd: true
    ssh_authorized_keys:
      # Your personal key (cat ~/.ssh/id_ed25519.pub)
      - ssh-ed25519 AAAA_REPLACE_WITH_YOUR_PUBLIC_KEY you@laptop
      # The deploy key used by GitHub Actions (cat caravan_deploy.pub)
      - ssh-ed25519 AAAA_REPLACE_WITH_THE_DEPLOY_PUBLIC_KEY github-actions

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - ufw
  - fail2ban
  - unattended-upgrades

write_files:
  # Must sort before 50-cloud-init.conf: sshd keeps the first value it reads.
  - path: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/docker/daemon.json
    content: |
      { "log-driver": "json-file", "log-opts": { "max-size": "10m", "max-file": "3" } }

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker deploy
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable
  - systemctl enable --now fail2ban
  - mkdir -p /opt/caravan
  - chown deploy:deploy /opt/caravan
  - systemctl restart ssh
