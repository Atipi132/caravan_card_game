# CI/CD: tests on every push & pull request; on pushes to `main`, build the Docker image,
# publish it to GitHub Container Registry and deploy it to the VPS over SSH.
#
# Required repository settings (Settings → Secrets and variables → Actions):
#   Secrets:   DEPLOY_HOST         VPS IP address or hostname
#              DEPLOY_SSH_KEY      private key whose public half is in the VPS `deploy` user's authorized_keys
#              DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <VPS IP>`
#   Variables: DOMAIN              public hostname, e.g. caravan-yourname.duckdns.org
#              IMAGE_PLATFORMS     optional, default linux/amd64 (use linux/arm64 for ARM servers)

name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: contains(vars.IMAGE_PLATFORMS, 'arm64')
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/id_deploy\n  ServerAliveInterval 30\n' "${{ secrets.DEPLOY_HOST }}" > ~/.ssh/config
      - name: Upload stack files
        run: scp deploy/docker-compose.yml deploy/Caddyfile deploy/deploy.sh vps:/opt/caravan/
      - name: Deploy
        run: |
          ssh vps "chmod +x /opt/caravan/deploy.sh && \
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null && \
            DOMAIN='${{ vars.DOMAIN }}' CARAVAN_IMAGE='${{ needs.image.outputs.image }}:${{ github.sha }}' /opt/caravan/deploy.sh; \
            status=\$?; docker logout ghcr.io >/dev/null; exit \$status"
      - name: Smoke test
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS "https://${{ vars.DOMAIN }}/healthz"; then exit 0; fi
            sleep 5
          done
          echo "Site not reachable" >&2; exit 1
