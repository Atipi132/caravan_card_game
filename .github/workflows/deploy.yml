# CI/CD: tests on every push & pull request; on pushes to `main`, build and deploy to Fly.io.
#
# Required repository settings (Settings → Secrets and variables → Actions):
#   Secret:   FLY_API_TOKEN  deploy token from `fly tokens create deploy -x 999999h`
#   Variable: FLY_APP        optional, overrides the `app = '...'` name in fly.toml

name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://${{ vars.FLY_APP || 'caravan-card-game' }}.fly.dev
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        run: ./deploy/deploy.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ vars.FLY_APP }}
