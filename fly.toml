# fly.toml app configuration file generated for caravan-card-game on 2026-11-18T11:54:34+01:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'caravan-card-game'
primary_region = 'cdg'
kill_signal = 'SIGINT'
kill_timeout = '10s'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'

[env]
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  PORT = '3000'
  SITE_URL = 'https://caravan-card-game.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 800

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
